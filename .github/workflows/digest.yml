name: build-digest

# Builds the in-app Mon/Wed/Fri field briefs (runs after the morning ingestion).
on:
  schedule:
    - cron: "0 7 * * 1,3,5"   # Mon/Wed/Fri 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build digest editions
        env:
          RF_DATABASE_URL: ${{ secrets.RF_DATABASE_URL }}
          RF_DEMO_RELATIVE_DATES: "false"
        run: python -m app.jobs.digest --window 3
