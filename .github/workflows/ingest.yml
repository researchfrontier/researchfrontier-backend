name: ingest-papers

# Pulls recent papers into the database on a schedule.
# GitHub Actions cron can be delayed under load (fine for ingestion) and a
# schedule-only repo auto-disables after 60 days of inactivity — workflow_dispatch
# and the weekly keepalive below avoid that.
on:
  schedule:
    - cron: "0 5 * * *"      # daily 05:00 UTC
    - cron: "0 0 * * 1"      # weekly keepalive (Monday 00:00 UTC)
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        default: "7"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run ingestion
        env:
          RF_DATABASE_URL: ${{ secrets.RF_DATABASE_URL }}
          RF_OPENALEX_API_KEY: ${{ secrets.RF_OPENALEX_API_KEY }}
          RF_CONTACT_EMAIL: ${{ secrets.RF_CONTACT_EMAIL }}
          RF_DEMO_RELATIVE_DATES: "false"
        run: python -m app.jobs.ingest --days "${{ github.event.inputs.days || '7' }}"
